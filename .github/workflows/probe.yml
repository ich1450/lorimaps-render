name: Probe data sources
on:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p logs
          for u in \
            https://listdata.thelist.tas.gov.au/opendata/data/LIST_TASVEG_50_STATEWIDE.zip \
            https://listdata.thelist.tas.gov.au/opendata/data/LIST_TASVEG_40_STATEWIDE.zip \
            https://listdata.thelist.tas.gov.au/opendata/ \
            https://listdata.thelist.tas.gov.au/opendata/data/ ; do
            echo "== $u" >> logs/probe.txt
            curl -sSIL --max-time 60 "$u" >> logs/probe.txt 2>&1 || echo "curl failed" >> logs/probe.txt
          done
          curl -sL --max-time 60 https://listdata.thelist.tas.gov.au/opendata/ | head -c 20000 > logs/opendata-index.html || true
          curl -sL --max-time 60 https://listdata.thelist.tas.gov.au/opendata/data/ | grep -io 'href="[^"]*TASVEG[^"]*"' > logs/tasveg-links.txt || true
          bash render/push_logs.sh logs "probe ${{ github.run_id }}" probe-logs
