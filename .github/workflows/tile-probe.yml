name: Tile probe
# Measures tile sizes of a LIST tile service (tools/probe_tiles.py); results in branch "tile-logs".
on:
  push:
    branches: [main]
    paths: ['tools/probe_tiles.py', '.github/workflows/tile-probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SERVICES: "Basemaps/Topographic Basemaps/TopographicGrayScale Basemaps/SimpleBasemap Basemaps/LabelsBasemap"
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          mkdir -p logs
          for s in $SERVICES; do
            mkdir -p "logs/${s#Basemaps/}"
            python3 tools/probe_tiles.py "$s" 8 18 "logs/${s#Basemaps/}" 2>&1 | tee -a logs/probe.log
          done
      - name: Publish logs
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash render/push_logs.sh logs "tile-probe ${{ github.run_id }} ${{ job.status }}" tile-logs
